[pytest]
testpaths = src/tests
pythonpath = src
# crosscheck / e2e 都要现编 C 并跑子进程，默认不跑：
#   pytest -m crosscheck   # S2 的 C/Python 数值交叉验证
#   pytest -m e2e          # S3 的 PC↔假 MCU 端到端回环
#   pytest -m "crosscheck or e2e"
addopts = -m "not crosscheck and not e2e"
markers =
    crosscheck: 需要本机 x86 gcc 的 C/Python 交叉验证
    e2e: 启动假 MCU 子进程 + Qt 事件循环的端到端回环
